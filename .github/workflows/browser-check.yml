name: Browser validation and genuine screenshots
on:
  workflow_dispatch:
  push:
    paths:
      - index.html
      - assets/**
      - browser-check.mjs
      - .github/workflows/browser-check.yml
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.65.1
          npx playwright install --with-deps chromium
      - name: Run responsive browser checks
        run: node browser-check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: genuine-browser-screenshots
          path: |
            ad.png
            evidence/
          if-no-files-found: error
